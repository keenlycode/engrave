site_name: 'Engrave Guide'
site_description: 'Guides for Engrave, a lightweight static-site generator built on Python and Jinja.'
site_url: https://keenlycode.github.io/engrave/
docs_dir: docs-src
site_dir: docs
repo_url: https://github.com/keenlycode/engrave
repo_name: keenlycode/engrave

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - CLI Overview: cli.md
  - Templates & Markdown: templates.md
  - Live Reload: live-reload.md

theme:
  variant: modern

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  version:
    provider: mike
